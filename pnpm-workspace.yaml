# One `pnpm install` at the root installs every package and the docs site, with one lockfile.
#   packages/format  the file-format reader (@ontology-kit/format): types, loading, relationship values
#   packages/okb     the okb CLI (@ontology-kit/okb), with the meta-KB, skills, examples and tests
#   packages/ontology-kit  the unscoped wrapper (ontology-kit) that forwards to okb
#   site          the docs site (private)
packages:
  - packages/*
  - site
