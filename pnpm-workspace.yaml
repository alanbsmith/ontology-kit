# One `pnpm install` at the root installs every package and the docs site, with one lockfile.
#   packages/okb  the okb CLI and library (@ontology-kit/okb), with the meta-KB, skills, examples and tests
#   site          the docs site (private)
# Later packages (the unscoped ontology-kit wrapper, a file-format package) go under packages/.
packages:
  - packages/*
  - site
