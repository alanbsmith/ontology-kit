# Prose linter for the hand-written docs: https://vale.sh
# `vale sync` downloads the style packages into .vale/styles (gitignored);
# the project vocabulary is in .vale/styles/config/vocabularies/Okb.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Okb
Packages = Google, write-good

[*.md]
BasedOnStyles = Vale, Google, write-good, Okb
# ALL-CAPS tokens are identifiers here (MUST, QUOTE, SUPPORTED, IS_A).
TokenIgnores = (\b[A-Z][A-Z_][A-Z_]+\b)

# Tuned for clarity without noise.
# Flags every "is"; not a clarity problem:
write-good.E-Prime = NO
# Parenthetical asides and semicolons are fine in reference docs:
Google.Parens = NO
Google.Semicolons = NO
# House style: no serial comma, and "Step 3: Terms" headings:
Google.OxfordComma = NO
Google.Colons = NO
# write-good.Passive covers passive voice:
Google.Passive = NO
# Flags MUST/SHOULD/MAY, which are rule modalities here:
Google.Acronyms = NO
# Quoted strings are often literal text, so punctuation stays outside them:
Google.Quotes = NO
# "..." marks a deliberate gap in a verbatim quote:
Google.Ellipses = NO
