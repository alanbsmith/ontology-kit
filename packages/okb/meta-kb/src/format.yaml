# The okb file format: node and edge types an ontology built with this toolkit may use.
# okb validate reads this registry (rule struct-well-formed), so it is the single
# source of truth for the format. docs/FORMAT.md explains it for humans.
#
#   models   - the glossary concept this type implements
#   origin   - ontology101 (Ontology 101's modeling primitive) or operational (toolkit/LPG plumbing)
#   provenance - (edge types) true for the quote, source and rule layer; the public API's
#                PROVENANCE_EDGE_TYPES list in @ontology-kit/format is built from it
#
# The meta-KB build (meta-kb/build.ts) compiles this file into the meta-KB graph and writes the
# type names into packages/format/src/registry.ts, which the reader package ships as data.

version: "okb-lpg/3"

# Every node type also has two optional properties, set by okb (not listed per type below):
#   createdAt - when the node was made, UTC to the second ("2026-11-21T14:03:22Z")
#   updatedAt - when something stored ON the node last changed: its own fields, property
#               values and facets. Edges (IS_A, HAS_SLOT, CITES, relationship values, ...)
#               carry no stamps and changing them doesn't count. Missing on nodes from
#               files written before okb-lpg/3: read that as unknown.

nodeTypes:
  - {name: Ontology, origin: operational, models: concept.scope, required: [id, name],
     description: "Exactly one per ontology (id 'ontology'). Holds scope (domain, purpose, users, maintainers, outOfScope), conventions, reuseReviewed, and kind ('application' or 'terminological')."}
  - {name: CompetencyQuestion, origin: ontology101, models: concept.competency-question, required: [id, text],
     description: "A question the ontology must answer. status: draft | answerable."}
  - {name: Term, origin: ontology101, models: concept.class, required: [id, text],
     description: "A Step-3 brainstorm term. disposition: undecided | class | slot | instance | value | synonym | out-of-scope."}
  - {name: ReusedOntology, origin: ontology101, models: concept.ontology, required: [id, name, decision],
     description: "An existing ontology/vocabulary considered in Step 2. decision: reuse | adapt | reference | rejected."}
  - {name: Class, origin: ontology101, models: concept.class, required: [id, name],
     description: "description, formerNames[] (earlier names, set by okb rename), synonyms[], abstract, terminological, fixedValues{slotId: value}, defaults{slotId: value}, facetOverrides{slotId: {allowedValues, minCardinality, maxCardinality}}."}
  - {name: Slot, origin: ontology101, models: concept.slot, required: [id, name],
     description: "description, formerNames[], formerRelTypes[] (edge types before renames), valueType (String|Integer|Float|Number|Boolean|Enumerated|Instance), allowedValues[], cardinality (single|multiple), minCardinality, maxCardinality, default, relType (Instance slots only: the edge type its values are stored as), appliesToRules (Boolean, property slots only: the slot applies to every Rule)."}
  - {name: Instance, origin: ontology101, models: concept.instance, required: [id, name],
     description: "description, formerNames[], values{slotId: value | [values]} for property (non-Instance) slots. Relationship values are edges."}
  - {name: DesignDecision, origin: ontology101, models: concept.design-decision, required: [id, title, decision],
     description: "question, decision, rationale, alternatives[], metaRules[] (rule ids it resolves or waives), date."}
  - {name: Source, origin: operational, models: concept.lpg, required: [id, title],
     description: "Provenance: a document content was extracted from (`okb source add`). localPath (checked by okb validate), format (markdown | pdf | text), url (rendered page), repoUrl (GitHub file URL, for line links), meta (markdown frontmatter), blocks[] (hash, kind, headingPath, rowKey, preview of each quotable block the KB last saw, so `okb source refresh --all` can list new and changed blocks)."}
  - {name: SourceLocation, origin: operational, models: concept.lpg, required: [id, quote],
     description: "Provenance: a verbatim passage (`okb quote add`). locator (heading path, or p.N for PDFs), headingPath[], startLine/endLine/lines, blockKind, sourceLink (GitHub ?plain=1#Lx-Ly), pageLink (rendered heading anchor), page (PDFs)."}
  - {name: Rule, origin: operational, models: concept.lpg, required: [id, modality, statement],
     description: "A domain rule: a requirement on any implementation (prescriptive), e.g. 'Buttons meet a 24px minimum touch target'. Extracted from documentation or authored by the ontology owner (`okb rule add`). authored (Boolean: written by the owner, not extracted; still cites a quote and is verified), extracted, extractionConfidence, verification{status, checkedAgainst}, _originalDraft, values{slotId: value | [values]} for qualifier slots that apply to Rules (e.g. condition, inputModality). Not inherited through REFINES."}

# Relationship values are NOT listed here: an Instance-type Slot gets a `relType`
# (its name in UPPER_SNAKE case, e.g. maker -> MAKER), and each value is an edge of
# that type: (instance)-[:MAKER]->(instance), or (Class)-[:GOES_WELL_WITH]->(Class)
# for a fixed class-level value. Inverse slots share one edge type (see INVERSE_OF).
edgeTypes:
  - {name: IS_A, from: [Class], to: [Class], origin: ontology101, models: concept.subclass,
     description: "Subclass → superclass. Transitive; no cycles."}
  - {name: INSTANCE_OF, from: [Instance], to: [Class], origin: ontology101, models: concept.instance,
     description: "Instance → its class (most specific one that fits). An instance may have more than one."}
  - {name: HAS_SLOT, from: [Class], to: [Slot], origin: ontology101, models: concept.domain,
     description: "Class → slot attached to it. The set of these classes is the slot's domain."}
  - {name: RANGE, from: [Slot], to: [Class], origin: ontology101, models: concept.range,
     description: "Instance-type slot → allowed class of its values."}
  - {name: INVERSE_OF, from: [Slot], to: [Slot], origin: ontology101, models: concept.inverse-slots,
     description: "Declares two relationship slots inverse. The `from` slot's relType is the stored direction; the `to` slot reads those edges backwards. Stored once."}
  - {name: DISJOINT_WITH, from: [Class], to: [Class], origin: ontology101, models: concept.disjoint,
     description: "Declares two classes disjoint. Stored once; symmetric."}
  - {name: NEEDS, from: [CompetencyQuestion], to: [Class, Slot, Instance], origin: operational, models: concept.competency-question,
     description: "Competency question → an element needed to answer it."}
  - {name: BECAME, from: [Term], to: [Class, Slot, Instance], origin: operational, models: concept.class,
     description: "Step-3 term → what it turned into."}
  - {name: ABOUT, from: [DesignDecision], to: [Class, Slot, Instance, CompetencyQuestion, Term, ReusedOntology, Ontology, Rule], origin: operational, models: concept.design-decision,
     description: "Design decision → what it's about."}
  - {name: CITES, provenance: true, from: [Class, Slot, Instance, Rule, DesignDecision], to: [SourceLocation], origin: operational, models: concept.lpg,
     description: "Provenance: element → the verbatim passage it came from."}
  - {name: PART_OF, provenance: true, from: [SourceLocation], to: [Source], origin: operational, models: concept.lpg,
     description: "Provenance: passage → its document."}
  - {name: GOVERNS, provenance: true, from: [Rule], to: [Class, Slot, Instance], origin: operational, models: concept.lpg,
     description: "Domain rule → what it constrains."}
  - {name: REFINES, provenance: true, from: [Rule], to: [Rule], optionalProps: [adds], origin: operational, models: concept.rule-refines,
     description: "Rule → the broader rule it narrows by adding a part, condition, key or case. Stored in one direction. Optional `adds` (String) names what it adds, so a verifier can check that detail appears in the quote."}
  - {name: FULFILLS, provenance: true, from: [Instance], to: [Rule], origin: operational, models: concept.rule-fulfills,
     description: "A descriptive fact (an Instance, e.g. of a Behavior class) → the rule it meets. Many instances may fulfill one rule; read backwards it is 'fulfilled by', not 'requires'. Stored in one direction."}

# The shape of each node type's properties, as JSON Schema fragments. The meta-KB build turns these
# (with `required` above and the stamps) into packages/okb/schema/*.schema.json, which ships with
# @ontology-kit/okb. A node may also carry keys not listed here (okb keeps them), so the schema
# doesn't forbid extra properties. Fragments may $ref the `definitions` below.
definitions:
  Literal: {type: [string, number, boolean]}
  StoredValue:
    anyOf:
      - {$ref: "#/$defs/Literal"}
      - {type: array, items: {$ref: "#/$defs/Literal"}}
  ValueMap: {type: object, additionalProperties: {$ref: "#/$defs/StoredValue"}}
  Strings: {type: array, items: {type: string}}
  SourceBlock:
    type: object
    required: [hash, kind, headingPath, preview]
    properties:
      hash: {type: string}
      kind: {type: string}
      headingPath: {$ref: "#/$defs/Strings"}
      rowKey: {type: string}
      preview: {type: string}
  Verification:
    type: object
    required: [status]
    properties:
      status: {enum: [SUPPORTED, OVERREACH, UNSUPPORTED]}
      checkedAgainst: {$ref: "#/$defs/Strings"}
      note: {type: string}
      ref: {type: string, pattern: "^https?://\\S+$"}
      approvedAfter: {enum: [SUPPORTED, OVERREACH, UNSUPPORTED]}
  Extracted:
    extracted: {type: boolean}
    verification: {$ref: "#/$defs/Verification"}
    extractionConfidence: {enum: [verbatim, paraphrased, corrected]}
    _originalDraft: {type: string}

nodeProperties:
  Ontology:
    name: {type: string}
    domain: {type: string}
    purpose: {type: string}
    users: {$ref: "#/$defs/Strings"}
    maintainers: {$ref: "#/$defs/Strings"}
    outOfScope: {$ref: "#/$defs/Strings"}
    kind: {enum: [application, terminological]}
    reuseReviewed: {type: boolean}
    conventions:
      type: object
      properties:
        classCase: {type: string}
        slotCase: {type: string}
        instanceCase: {type: [string, "null"]}
        classNumber: {enum: [singular, plural]}
        slotAffix: {enum: [none, has-prefix, of-suffix]}
        source: {enum: [chosen, default]}
  CompetencyQuestion:
    text: {type: string}
    status: {enum: [draft, answerable]}
  Term:
    text: {type: string}
    disposition: {enum: [undecided, class, slot, instance, value, synonym, out-of-scope]}
    note: {type: string}
  ReusedOntology:
    name: {type: string}
    url: {type: string}
    decision: {enum: [reuse, adapt, reference, rejected]}
    notes: {type: string}
  Class:
    $extracted: true
    name: {type: string}
    formerNames: {$ref: "#/$defs/Strings"}
    description: {type: string}
    synonyms: {$ref: "#/$defs/Strings"}
    abstract: {type: boolean}
    terminological: {type: boolean}
    fixedValues: {$ref: "#/$defs/ValueMap"}
    defaults: {$ref: "#/$defs/ValueMap"}
    facetOverrides:
      type: object
      additionalProperties:
        type: object
        properties:
          allowedValues: {type: array, items: {$ref: "#/$defs/Literal"}}
          minCardinality: {type: integer, minimum: 0}
          maxCardinality: {type: integer, minimum: 0}
          range: {$ref: "#/$defs/Strings"}
  Slot:
    $extracted: true
    name: {type: string}
    formerNames: {$ref: "#/$defs/Strings"}
    description: {type: string}
    valueType: {enum: [String, Integer, Float, Number, Boolean, Enumerated, Instance]}
    allowedValues: {$ref: "#/$defs/Strings"}
    cardinality: {enum: [single, multiple]}
    minCardinality: {type: integer, minimum: 0}
    maxCardinality: {type: integer, minimum: 0}
    default: {$ref: "#/$defs/StoredValue"}
    relType: {type: string, pattern: "^[A-Z][A-Z0-9_]*$"}
    formerRelTypes:
      type: array
      items: {type: string, pattern: "^[A-Z][A-Z0-9_]*$"}
    edgeProperties:
      type: array
      items:
        type: object
        required: [name, valueType]
        properties:
          name: {type: string}
          valueType: {enum: [String, Integer, Float, Number, Boolean, Enumerated]}
          allowedValues: {$ref: "#/$defs/Strings"}
          required: {type: boolean}
          description: {type: string}
    appliesToRules: {type: boolean}
  Instance:
    $extracted: true
    name: {type: string}
    formerNames: {$ref: "#/$defs/Strings"}
    description: {type: string}
    values: {$ref: "#/$defs/ValueMap"}
  DesignDecision:
    $extracted: true
    title: {type: string}
    decision: {type: string}
    question: {type: string}
    rationale: {type: string}
    alternatives: {$ref: "#/$defs/Strings"}
    metaRules: {$ref: "#/$defs/Strings"}
    date: {type: string}
  Source:
    title: {type: string}
    localPath: {type: string}
    format: {enum: [markdown, pdf, text]}
    url: {type: string}
    repoUrl: {type: string}
    meta: {type: object}
    blocks: {type: array, items: {$ref: "#/$defs/SourceBlock"}}
  SourceLocation:
    quote: {type: string}
    locator: {type: string}
    headingPath: {$ref: "#/$defs/Strings"}
    startLine: {type: integer}
    endLine: {type: integer}
    lines: {type: string}
    blockKind: {type: string}
    sourceLink: {type: string}
    pageLink: {type: string}
    page: {type: [integer, string]}
  Rule:
    $extracted: true
    name: {type: string}
    modality: {enum: [MUST, MUST_NOT, SHOULD, SHOULD_NOT, MAY]}
    statement: {type: string}
    authored: {type: boolean}
    values: {$ref: "#/$defs/ValueMap"}

# Edge properties beyond from, type and to are free-form (a relationship slot declares its own,
# see Slot.edgeProperties); these are the ones the format reserves, with their shapes.
reservedEdgeProperties:
  rule: {type: string, description: "The Rule node whose quote and verification justify this link."}
