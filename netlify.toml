# The Ontology Kit docs site (site/). Netlify's build image installs pnpm itself before the build
# command runs (PNPM_VERSION pins it to the version in package.json's `packageManager`), so the command
# must not install it again: `npm i -g pnpm` fails there with EEXIST. One `pnpm install` covers the whole
# workspace (the root, packages/okb and site/; see pnpm-workspace.yaml). `pnpm site` regenerates the docs from the meta-KB first, so the
# deployed pages are never stale.
[build]
  command = "pnpm install --frozen-lockfile && pnpm site"
  publish = "site/dist"

[build.environment]
  NODE_VERSION = "26"
  PNPM_VERSION = "12.21.0"
