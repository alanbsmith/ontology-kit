# Publishes both packages to npm when a version tag is pushed, after CI passes.
#   Tag:        git tag -a vX.Y.Z -m "vX.Y.Z" && git push origin vX.Y.Z
#   Dry run:    Actions > Release > Run workflow (everything except the publish and the GitHub release)
# Publishing uses npm trusted publishing (OIDC): no npm token is stored anywhere. Each package needs
# a trusted publisher on npmjs.com for this repository, workflow file `release.yml` and environment
# `release`. The one-time setup and the release steps are in CONTRIBUTING.md ("Releases").
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every step except the real publish and the GitHub release
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag, versions and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      dry-run: ${{ steps.check.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check the tag, both package versions and the changelog entry
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_INPUT: ${{ inputs.dry-run }}
        run: |
          dry_run=false
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$DRY_RUN_INPUT" = true ]; then dry_run=true; fi
            if [ "$dry_run" = false ] && [ "$REF_TYPE" != tag ]; then
              echo "::error::A real release runs from a version tag. Push the tag, or run this workflow with dry-run on."
              exit 1
            fi
          fi
          version="$(node scripts/release.ts version)"
          tag="v${version}"
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            # The tag must be on main: a release is what was merged and reviewed.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
              if [ "$dry_run" = false ]; then
                echo "::error::The tagged commit is not on main."
                exit 1
              fi
              echo "::warning::The tagged commit is not on main (a real release would stop here)."
            fi
          fi
          node scripts/release.ts check "$tag"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "dry-run=$dry_run"
          } >> "$GITHUB_OUTPUT"

  # The whole CI workflow: typecheck, build and test, generated files, docs, site, Node 24 runtime.
  ci:
    name: CI
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional: add required reviewers to this environment (Settings > Environments) to approve each publish.
    # npm's trusted publisher setting names it too.
    environment: release
    permissions:
      id-token: write # npm trusted publishing and provenance
      contents: write # the GitHub release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
      DRY_RUN: ${{ needs.verify.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Check that npm can publish with trusted publishing (11.5.1 or newer)
        run: |
          npm --version
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (!(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))))) {
              console.error("::error::npm 11.5.1 or newer is required for trusted publishing");
              process.exit(1);
            }
          ' "$(npm --version)"
      # `pnpm pack` builds dist/ (prepack) and rewrites the wrapper's workspace:* dependency to the real version.
      - name: Pack both packages
        run: |
          mkdir tarballs
          pnpm --filter @ontology-kit/okb pack --pack-destination tarballs
          pnpm --filter ontology-kit pack --pack-destination tarballs
          ls -l tarballs
      - name: Write the release notes from the changelog
        run: node scripts/release.ts notes "$TAG" > release-notes.md
      # okb first: the wrapper depends on it. A version already on npm is skipped, so a re-run finishes
      # a release that stopped halfway. `npm publish` of a tarball does the OIDC token exchange; provenance
      # is on explicitly so the publish fails rather than going out without it.
      - name: Publish @ontology-kit/okb, then ontology-kit
        run: |
          set -eu
          flags="--access public --provenance"
          case "$VERSION" in *-*) flags="$flags --tag next" ;; esac
          if [ "$DRY_RUN" = true ]; then flags="$flags --dry-run"; fi
          for entry in "@ontology-kit/okb:tarballs/ontology-kit-okb-${VERSION}.tgz" "ontology-kit:tarballs/ontology-kit-${VERSION}.tgz"; do
            name="${entry%%:*}"
            tarball="${entry#*:}"
            if [ -n "$(npm view "${name}@${VERSION}" version 2>/dev/null)" ]; then
              echo "${name}@${VERSION} is already on npm; skipping."
              continue
            fi
            # shellcheck disable=SC2086
            npm publish "$tarball" $flags
          done
      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it."
            exit 0
          fi
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" tarballs/*.tgz --verify-tag --title "$TAG" --notes-file release-notes.md $prerelease
