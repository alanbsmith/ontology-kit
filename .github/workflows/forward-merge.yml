# Keeps prerelease/alpha in sync with main: every push to main is merged forward into it (a merge commit, never a
# squash, so the branches don't diverge). If the merge conflicts, a pull request is opened for a person to resolve.
# It needs a secret, FORWARD_MERGE_TOKEN: a GitHub App token or a fine-grained PAT with contents and pull-requests
# write access that may bypass the prerelease/alpha ruleset. A push made with the default GITHUB_TOKEN starts no
# other workflow, so that push would get no CI and no alpha release. See CONTRIBUTING.md ("Alpha releases").
name: Forward-merge main into prerelease/alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: forward-merge
  cancel-in-progress: false

jobs:
  forward-merge:
    name: Merge main forward
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the token below does the writing
    env:
      GH_TOKEN: ${{ secrets.FORWARD_MERGE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check that the token is set
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The FORWARD_MERGE_TOKEN secret is not set (see CONTRIBUTING.md, 'Alpha releases')."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prerelease/alpha
          fetch-depth: 0
          token: ${{ secrets.FORWARD_MERGE_TOKEN }}
          # The token isn't left in .git/config; the pushes below pass it explicitly.
          persist-credentials: false
      - name: Merge main, or open a pull request when it conflicts
        env:
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          git fetch --no-tags "$remote" main
          if git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
            echo "prerelease/alpha already has ${MAIN_SHA}."
            exit 0
          fi
          # prerelease/alpha can move between the checkout and the push (a pull request merging into it), which
          # rejects the push as non-fast-forward. Refetch, redo the merge and push again, up to three times; a
          # merge that conflicts, or a push that keeps failing, falls through to the pull request below.
          for attempt in 1 2 3; do
            if ! git merge --no-ff -m "chore: Merge main into prerelease/alpha" "$MAIN_SHA"; then
              git merge --abort
              break
            fi
            if git push "$remote" HEAD:prerelease/alpha; then
              exit 0
            fi
            echo "The push was rejected (attempt ${attempt}); refetching prerelease/alpha."
            git reset --hard -q HEAD^
            git fetch --no-tags "$remote" prerelease/alpha
            git reset --hard -q FETCH_HEAD
            if git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
              echo "prerelease/alpha already has ${MAIN_SHA}."
              exit 0
            fi
          done
          # A branch at main's commit: the pull request shows the conflicts, and a person merges
          # prerelease/alpha into it (or resolves them in the web editor) and merges the pull request.
          branch="forward-merge/main-${MAIN_SHA:0:7}"
          git push --force "$remote" "${MAIN_SHA}:refs/heads/${branch}"
          if [ -n "$(gh pr list --head "$branch" --base prerelease/alpha --json number -q '.[].number')" ]; then
            echo "A pull request for ${branch} is already open."
            exit 0
          fi
          gh pr create --base prerelease/alpha --head "$branch" \
            --title "chore: Merge main into prerelease/alpha" \
            --body "$(printf '## Release Category\n\nInfrastructure\n\n## Release Notes\n\nNone\n\nThe forward merge of `main` (%s) conflicts. Resolve the conflicts, then **merge this pull request with a merge commit** (not a squash), so the branches stay in sync.' "$MAIN_SHA")"
