version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows and .github/actions current.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns:
          - "*"

  # Covers the pnpm workspace: the root, packages/* and site/ share one lockfile.
  - package-ecosystem: npm
    directories:
      - /
      - /packages/*
      - /site
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
